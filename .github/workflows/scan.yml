name: One-time encrypted scanner runtime transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Encrypt existing scanner configuration
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          names = ['FEISHU_WEBHOOK', 'SUPABASE_URL', 'SUPABASE_SERVICE_KEY', 'ETHERSCAN_KEY', 'CRON_SECRET']
          values = {name: os.environ.get(name, '') for name in names}
          missing = [name for name in names[:3] if not values[name]]
          if missing:
              raise SystemExit('Missing required keys: ' + ', '.join(missing))
          subprocess.run([
              'openssl', 'cms', '-encrypt', '-binary', '-aes-256-gcm',
              '-outform', 'DER', '-out', 'scanner-runtime.cms',
              'scripts/ops/runtime-transfer-cert.pem',
          ], input=json.dumps(values).encode(), check=True)
          print('Runtime encrypted; plaintext configuration was never written to disk.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-scanner-runtime
          path: scanner-runtime.cms
          retention-days: 1
